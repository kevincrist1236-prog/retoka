<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121114">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Retoka">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Retoka · Editor de fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Anton&family=Bebas+Neue&family=Montserrat:ital,wght@0,400;0,700;0,800;1,400;1,700&family=Poppins:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Serif+Display:ital@0;1&family=Great+Vibes&family=Dancing+Script:wght@400;700&family=Pacifico&family=Lobster&family=Oswald:wght@400;700&family=Raleway:ital,wght@0,400;0,800;1,400&family=Abril+Fatface&family=Caveat:wght@400;700&family=Archivo+Black&family=Cinzel:wght@400;700&family=Righteous&family=Permanent+Marker&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: estudio de revelado: sereno, profesional, pero cálido para quien empieza.
   IDEA: una mesa de luz de fotógrafo: lienzo al centro, inspector a la derecha, tira de negativos abajo.
   PICTURE: la foto editada en vivo domina la pantalla sobre carbón profundo.
   COLOUR and TYPE: carbón #121114, crema #f6efe2 del logo, rojo #ef3b4f de acento; Outfit (redonda como el logo).
   LAYOUT: barra superior, lienzo + tira de fotos a la izquierda, inspector con pestañas en cuadrícula a la derecha; en móvil todo apilado. */
:root{color-scheme:dark;--bg:#121114;--s1:#1b1a1f;--s2:#25232a;--s3:#302d36;--ink:#f6efe2;--mute:#a9a3ad;--line:#2e2c33;--acc:#ef3b4f;--cream:#f6efe2}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Outfit,system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:58px minmax(0,1fr) 104px;height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line)}
.top .logo{height:25px;flex:none}
.modes{display:flex;gap:4px;margin-left:18px}
.modes button{padding:8px 12px;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;border-radius:0}
.modes button.on{color:var(--ink);border-color:var(--acc)}
.tb{display:flex;gap:6px;align-items:center;margin-left:auto}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--s2);color:var(--ink)}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{background:var(--acc);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;min-height:42px}
.btn:hover{filter:brightness(1.08)}
#exp{display:flex;align-items:center;gap:6px}#exp svg{stroke:#fff}
button,label,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cmp .short{display:none}.add b{font-size:20px;font-weight:600;display:block;line-height:1}.add span{display:block}
.grab{display:none}
.app.vid{grid-template-rows:58px minmax(0,1fr) 196px}.app.vid .film{display:block;padding:0;overflow:hidden}.app.vid .cmp{display:none}
.tl{display:flex;flex-direction:column;height:100%}
.tlbar{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--line)}
#vplay{background:var(--cream);color:#16141a;border-radius:999px}#vplay svg{fill:#16141a;stroke:none}
.tls{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
.tlt{position:relative;height:100%;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.ruler{height:20px;position:relative;color:var(--mute);font-size:13px}.ruler span{position:absolute;top:1px}
.trow{position:relative;height:58px;margin-top:2px}.trow.aux{height:54px}
.clip{position:absolute;top:0;height:100%;border-radius:8px;background-size:auto 100%;background-repeat:repeat-x;background-color:#2a2830;border:2px solid transparent;overflow:hidden;box-sizing:border-box}
.clip.on{border-color:var(--cream)}.clip b{position:absolute;left:4px;bottom:3px;font-size:13px;font-weight:600;background:rgba(0,0,0,.6);padding:0 5px;border-radius:5px}
.trm{position:absolute;left:-3px;top:50%;width:12px;height:12px;background:var(--acc);transform:translateY(-50%) rotate(45deg);border-radius:2px}
.tchip{position:absolute;top:2px;height:24px;border-radius:6px;background:#7b5cff;color:#fff;font-size:13px;padding:2px 6px;white-space:nowrap;overflow:hidden;box-sizing:border-box}.tchip.on{outline:2px solid var(--cream)}
.sdot{position:absolute;top:34px;width:12px;height:12px;border-radius:99px;background:#ffb020;transform:translateX(-50%);border:2px solid #121114}
.mbar{position:absolute;top:30px;height:20px;border-radius:6px;background:rgba(63,208,164,.3);color:#bff3e1;font-size:13px;padding:0 8px;white-space:nowrap;overflow:hidden;pointer-events:none;line-height:20px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);pointer-events:none;margin-left:-1px}.ph::before{content:'';position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--acc)}
.sfx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.sfx div{display:flex;align-items:center;gap:4px;background:var(--s2);border-radius:10px;padding:4px 4px 4px 10px;font-size:14px}.sfx span{flex:1}
.ib2{width:36px;height:36px;border-radius:8px;background:var(--s3);font-size:15px}
.stage{position:relative;overflow:auto;display:flex;padding:58px 28px 24px;background:radial-gradient(circle at 50% 40%,#1d1b21,#121114 70%)}
#cv{margin:auto;flex:none;box-shadow:0 30px 70px -20px #000;touch-action:none}
.bar{position:absolute;left:16px;right:16px;top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar select{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px}
.pill{background:var(--s2);color:var(--mute);font-size:13px;padding:6px 12px;border-radius:999px}
.pill.hot{background:var(--acc);color:#fff}
.cmp{position:absolute;right:16px;bottom:14px;background:var(--s2);border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.film{grid-column:1;grid-row:3;border-top:1px solid var(--line);display:flex;gap:10px;padding:12px 16px;overflow-x:auto;align-items:center;background:var(--s1)}
.film .th{position:relative;flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--s2)}
.film .th img{width:100%;height:100%;object-fit:cover;display:block}
.film .th.on{border-color:var(--cream)}
.film .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:24px;text-align:center}
.add{flex:none;width:76px;height:76px;border-radius:10px;border:1.5px dashed #5a5560;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--mute);cursor:pointer;line-height:1.2}
.add input{position:absolute;opacity:0;width:1px;height:1px}
.insp{grid-column:2;grid-row:2/4;background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:8px 2px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mute);min-height:54px}
.tabs button:hover{background:var(--s2)}
.tabs button.on{background:var(--cream);color:#16141a}
.panel{overflow:auto;padding:18px 18px 40px;flex:1}
.panel h2{font-size:21px;margin:0 0 2px;font-weight:700}
.panel h3{font-size:14px;margin:20px 0 10px;color:var(--mute);font-weight:600}
.sub{margin:0 0 14px;color:var(--mute);font-size:14px}
.card{background:var(--s2);border-radius:16px;padding:16px;margin-bottom:12px}
.card b{font-size:16px;display:block}
.card p{margin:4px 0 12px;color:var(--mute);font-size:14px}
.card.hero{background:linear-gradient(140deg,#2a1520,#ef3b4f);}
.card.hero p{color:#ffe3e7}
.diag{margin-top:14px;background:rgba(0,0,0,.28);border-radius:12px;padding:12px 14px;font-size:14px}.diag ul{margin:8px 0;padding-left:18px}.diag p{margin:0;color:#ffe3e7}.diag .pill{background:var(--cream);color:#16141a;text-transform:capitalize}
.wb{width:100%;padding:11px;border-radius:12px;background:var(--cream);color:#16141a;font-weight:700;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px}
.wb[href]{text-decoration:none}
.wb:disabled{opacity:.5;cursor:wait}
.gb{padding:10px 14px;border-radius:12px;background:var(--s3);font-weight:600;min-height:44px}
.gb.full{width:100%;margin-top:8px}
.gb.on{background:var(--acc);color:#fff}
.sl{display:block;margin:0 0 12px}
.sl span{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:2px}
.sl output{color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.prog{height:6px;background:var(--s3);border-radius:9px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--cream);transition:width .2s}
.st{font-size:13px;color:var(--mute);margin-top:8px;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{padding:8px 13px;border-radius:999px;background:var(--s3);font-weight:600;font-size:14px;min-height:40px;border:2px solid transparent}
.ch.on{border-color:var(--cream)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fgrid button{padding:0;font-size:13px;font-weight:600;color:var(--mute);display:grid;gap:4px}
.fgrid canvas{width:100%;aspect-ratio:4/5;border-radius:10px;border:2px solid transparent;display:block}
.fgrid .on canvas{border-color:var(--cream)}.fgrid .on{color:var(--ink)}
.tpre{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpre button{background:var(--s2);border-radius:12px;padding:12px 8px;min-height:62px;line-height:1.1}
textarea{width:100%;min-height:76px;border-radius:12px;border:1px solid var(--line);background:var(--s2);padding:10px;font-size:16px;resize:vertical}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:220px;overflow:auto;padding:2px}
.fonts button{background:var(--s2);border-radius:10px;padding:9px 6px;font-size:18px;border:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts .on{border-color:var(--cream)}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:32px;height:32px;border-radius:99px;border:2px solid #4a4650}
.sw input[type=color]{width:40px;height:34px;border:0;background:none;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.tpls button{background:var(--s2);border:2px solid transparent;border-radius:12px;padding:8px;display:grid;gap:4px;text-align:left;font-weight:600;font-size:14px;position:relative}
.tpls button.on{border-color:var(--cream)}.tpls svg{width:100%;display:block;border-radius:6px;background:#2a2830}
.tpls i{position:absolute;top:12px;right:12px;font-style:normal;font-size:13px;font-weight:700;background:#3a3840;color:var(--mute);padding:1px 8px;border-radius:99px}.tpls i.pro{background:var(--acc);color:#fff}
.sec{border-top:1px solid var(--line);padding:4px 0}.sec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;padding:12px 0;min-height:44px}
.sec summary::after{content:'+';color:var(--mute);font-size:20px}.sec[open] summary::after{content:'−'}.sec summary::-webkit-details-marker{display:none}
#hist{width:100%;height:84px;display:block;border-radius:10px;background:#16151a;margin-bottom:8px}
#curve{width:100%;aspect-ratio:1;display:block;border-radius:10px;touch-action:none;cursor:crosshair;margin:10px 0 6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:99px;margin-right:6px;vertical-align:middle}
.lays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lays button{background:var(--s2);border-radius:10px;padding:6px;border:2px solid transparent}
.lays .on{border-color:var(--cream)}
.lays svg{width:100%;display:block}
.step{display:flex;align-items:center;gap:14px;font-weight:700;font-size:18px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--s3);font-size:22px}
.hint{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cream);color:#16141a;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(246,239,226,.35) 50%,transparent 70%);background-size:250% 100%;opacity:0}
.scan.go{opacity:1;animation:sc 1s ease-in-out infinite}
@keyframes sc{from{background-position:120% 0}to{background-position:-30% 0}}
@media (prefers-reduced-motion:reduce){.scan.go{animation:none;opacity:.4}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:10;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--s1);border-radius:20px;padding:20px;width:min(860px,100%);max-height:90dvh;overflow:auto}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{margin:0;font-size:22px}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.outs figure{margin:0;display:grid;gap:8px}
.outs img{width:100%;border-radius:10px;display:block;background:repeating-conic-gradient(#333 0 25%,#444 0 50%) 0 0/20px 20px}
@media (max-width:820px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;height:100dvh}
 .top{min-height:50px;padding:env(safe-area-inset-top) 10px 0;gap:4px}.top .logo{height:19px}
 .tb{gap:2px}.ib{width:38px;height:38px}
 #exp{width:42px;height:38px;min-height:38px;padding:0;justify-content:center;border-radius:12px}#exp span{display:none}
 .stage{grid-row:2;padding:54px 10px 10px}
 .bar{top:8px;left:10px;right:10px;gap:8px;flex-wrap:nowrap}
 .bar .modes{margin:0;gap:2px;background:var(--s2);border-radius:999px;padding:3px;flex:none}
 .bar .modes button{padding:7px 10px;border:0;border-radius:999px;font-size:14px}
 .bar .modes button.on{background:var(--cream);color:#16141a}
 .bar select{padding:7px 8px;font-size:13px;min-width:0;flex:1 1 auto;max-width:150px}
 .pill:not(.hot){display:none}.pill.hot{position:absolute;top:44px;left:0;font-size:13px}
 .cmp{right:10px;bottom:10px;padding:7px 12px;font-size:13px}.cmp .long{display:none}.cmp .short{display:inline}
 .app.vid{grid-template-rows:auto minmax(0,1fr) 184px auto}
 .film{grid-row:3;padding:8px 10px;gap:8px}.film .th,.add{width:56px;height:56px}.add span{display:none}.film .x{width:22px;height:22px;line-height:22px}
 .insp{grid-column:1;grid-row:4;border:0;border-top:1px solid var(--line);flex-direction:column-reverse;max-height:none}
 .grab{display:flex;justify-content:center;align-items:center;width:100%;height:22px;background:var(--s1);flex:none}
 .grab i{width:44px;height:5px;border-radius:9px;background:#4a4650}
 .panel{flex:none;max-height:34dvh;padding:4px 14px 18px;transition:max-height .2s}.insp.big .panel{max-height:54dvh}
 .tabs{display:flex;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-bottom:0;border-top:1px solid var(--line);scrollbar-width:none}
 .tabs::-webkit-scrollbar{display:none}
 .tabs button{flex:none;min-width:66px;min-height:52px;font-size:13px}
 .panel h2{font-size:18px}.sub{font-size:13px;margin-bottom:10px}.card{padding:14px;border-radius:14px}.card p{font-size:13px}
 input[type=range]{height:34px}
 .tpls{gap:6px}.fgrid{gap:8px}
 .sheet{padding:16px}
}
</style>
</head>
<body>

function seekTo(v,t){return new Promise(r=>{if(Math.abs(v.currentTime-t)<.002&&v.readyState>=2)return r();let done=false;const h=()=>{if(done)return;done=true;v.removeEventListener('seeked',h);r()};v.addEventListener('seeked',h);v.currentTime=t;setTimeout(h,2500)})}
async function mixAudio(tot){const sr=48000,O=window.OfflineAudioContext||window.webkitOfflineAudioContext,c=new O(2,Math.max(1,Math.ceil(tot*sr)),sr);let any=false;
 for(const o of vLay()){const s=SRC[o.c.src];if(s.type!=='video')continue;const b=await decodeAudio(s);if(!b)continue;const n=c.createBufferSource();n.buffer=b;n.playbackRate.value=o.c.speed;const g=c.createGain();g.gain.value=o.c.vol*VD.vol;n.connect(g);g.connect(c.destination);n.start(o.start,o.c.in,o.c.out-o.c.in);any=true}
 if(VD.music&&MUS){try{if(!MUS.buffer)MUS.buffer=await c.decodeAudioData(await MUS.file.arrayBuffer());const n=c.createBufferSource();n.buffer=MUS.buffer;const g=c.createGain(),m=VD.music;g.gain.setValueAtTime(m.fin?0:m.vol,0);if(m.fin)g.gain.linearRampToValueAtTime(m.vol,1.5);g.gain.setValueAtTime(m.vol,Math.max(1.5,tot-2));if(m.fout)g.gain.linearRampToValueAtTime(0,tot);n.connect(g);g.connect(c.destination);n.start(0);any=true}catch(e){}}
 for(const f of VD.sfx){if(f.t>tot)continue;const b=await synth(f.k),n=c.createBufferSource(),g=c.createGain();n.buffer=b;g.gain.value=f.v;n.connect(g);g.connect(c.destination);n.start(f.t);any=true}
 return any?await c.startRendering():null}
async function pickCfg(W,H){const vc=[['avc1.640028','avc'],['avc1.4d0028','avc'],['avc1.42e028','avc'],['vp09.00.40.08','vp9']];let V0=null;
 for(const[codec,m]of vc){try{const s=await VideoEncoder.isConfigSupported({codec,width:W,height:H,bitrate:9e6,framerate:30});if(s.supported){V0={cfg:{codec,width:W,height:H,bitrate:9e6,framerate:30},m};break}}catch(e){}}
 let A0=null;if(window.AudioEncoder)for(const[codec,m]of[['mp4a.40.2','aac'],['opus','opus']]){try{const s=await AudioEncoder.isConfigSupported({codec,sampleRate:48000,numberOfChannels:2,bitrate:160000});if(s.supported){A0={cfg:{codec,sampleRate:48000,numberOfChannels:2,bitrate:160000},m};break}}catch(e){}}
 return{V0,A0}}
let muxLib=null;const loadMux=()=>muxLib||(muxLib=new Promise((ok,no)=>{const s=document.createElement('script');s.src='mux.js';s.onload=()=>ok(window.RetokaMux);s.onerror=()=>{muxLib=null;no(new Error('mux'))};document.head.appendChild(s)}));
async function vExport(){if(!VD.clips.length)return toast('Añade un video primero');if(vplay)vPause();const[W,H]=docSize(),tot=vTotal(),fps=30,N=Math.max(1,Math.round(tot*fps));
 if(!window.VideoEncoder)return toast('Tu navegador no puede crear MP4. Actualiza Chrome o Safari.');
 const{V0,A0}=await pickCfg(W,H);if(!V0)return toast('Tu navegador no puede codificar video en este formato.');
 $('#outs').innerHTML=`<div style="grid-column:1/-1"><p id="vxp">Preparando…</p><div class="prog"><i id="vxb"></i></div><button class="gb" id="vxc" style="margin-top:10px">Cancelar</button></div>`;$('#mod').hidden=false;
 let cancel=false;$('#vxc').onclick=()=>{cancel=true};const st=(t,p)=>{$('#vxp').textContent=t;if(p!=null)$('#vxb').style.width=p+'%'};
 try{const lib=await loadMux();st('Mezclando el audio…',2);const mixed=await mixAudio(tot);
  const tgt=new lib.ArrayBufferTarget(),mux=new lib.Muxer({target:tgt,video:{codec:V0.m,width:W,height:H,frameRate:fps},audio:mixed&&A0?{codec:A0.m,numberOfChannels:2,sampleRate:48000}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
  let err=null;const ve=new VideoEncoder({output:(ch,meta)=>mux.addVideoChunk(ch,meta),error:e=>err=e});ve.configure(V0.cfg);
  const oc=mk(W,H),ox=oc.getContext('2d');vLastI=-1;vsnapFor=-1;
  for(let f=0;f<N;f++){if(cancel||err)break;const t=Math.min(tot-.001,f/fps),a=vAt(t),s=SRC[a.c.src];if(s.type==='video')await seekTo(s.el,Math.min(a.local,s.dur-.01));
   vrender(ox,1,true,t);const fr=new VideoFrame(oc,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});ve.encode(fr,{keyFrame:f%60===0});fr.close();
   while(ve.encodeQueueSize>8)await new Promise(r=>setTimeout(r,5));if(f%5===0)st(`Creando video… ${Math.round(f/N*100)}%`,5+f/N*85)}
  if(cancel){ve.close();$('#mod').hidden=true;return toast('Exportación cancelada')}if(err)throw err;await ve.flush();
  if(mixed&&A0){st('Añadiendo el audio…',92);let aerr=null;const ae=new AudioEncoder({output:(ch,meta)=>mux.addAudioChunk(ch,meta),error:e=>aerr=e});ae.configure(A0.cfg);const n=mixed.length,L0=mixed.getChannelData(0),R0=mixed.numberOfChannels>1?mixed.getChannelData(1):L0;
   for(let i=0;i<n;i+=1024){const m=Math.min(1024,n-i),d=new Float32Array(m*2);d.set(L0.subarray(i,i+m),0);d.set(R0.subarray(i,i+m),m);const ad=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:m,numberOfChannels:2,timestamp:Math.round(i/48000*1e6),data:d});ae.encode(ad);ad.close()}
   await ae.flush();if(aerr)throw aerr}
  mux.finalize();const blob=new Blob([tgt.buffer],{type:'video/mp4'}),url=URL.createObjectURL(blob),name=`retoka-video-${Date.now()}.mp4`;st('¡Listo!',100);
  $('#outs').innerHTML=`<figure style="grid-column:1/-1;max-width:360px"><video src="${url}" controls playsinline style="width:100%;border-radius:10px;background:#000"></video>
   ${dl?`<button class="wb" id="vxdl">Descargar video (${(blob.size/1048576).toFixed(1)} MB)</button>`:`<a class="wb" href="${url}" download="${name}">Descargar video (${(blob.size/1048576).toFixed(1)} MB)</a>`}
   ${!mixed||!A0?'<p class="hint">Este video se exportó sin audio'+(mixed&&!A0?' porque tu navegador no puede codificarlo':'')+'.</p>':''}</figure>`;
  const b=$('#vxdl');if(b)b.onclick=async()=>{try{await dl.save({filename:name,data:blob});toast('Video guardado')}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar aquí')}}}
 catch(e){console.error(e);st('No se pudo exportar el video: '+(e&&e.message||e),0)}finally{vLastI=-1;draw()}}
